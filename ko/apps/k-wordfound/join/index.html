<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>찾았단어 초대</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ed;
      color: #222;
    }

    .card {
      width: min(88vw, 420px);
      padding: 32px 24px;
      text-align: center;
      background: white;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .message {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
    }

    .label {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .code {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .note {
      margin-top: 28px;
      font-size: 14px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>찾았단어</h1>

    <p class="message">
      친구가 같이 찾기에 초대했어요.
    </p>

    <div class="label">초대 코드</div>
    <div class="code" id="inviteCode">--------</div>

    <p class="note">
      찾았단어 앱에서 위 초대 코드로 참여할 수 있습니다.
    </p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawCode = params.get("code") || "";
    const code = rawCode
      .toUpperCase()
      .replace(/[^A-Z2-9]/g, "")
      .slice(0, 8);

    document.getElementById("inviteCode").textContent =
      code.length === 8 ? code : "잘못된 코드";
  </script>
</body>
</html>

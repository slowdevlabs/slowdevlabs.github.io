  <text x="419" y="409" fill="#F7F8FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle">195 Countries</text>
  <rect x="540" y="372" width="214" height="56" rx="28" fill="#F7F8FF" fill-opacity="0.10"/>
  <text x="647" y="409" fill="#F7F8FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Offline First</text>
  <rect x="776" y="118" width="340" height="390" rx="36" fill="url(#card)" stroke="#405080" stroke-opacity="0.55"/>
  <rect x="816" y="176" width="260" height="78" rx="26" fill="url(#stripe1)"/>
  <rect x="816" y="264" width="260" height="78" rx="26" fill="url(#stripe2)"/>

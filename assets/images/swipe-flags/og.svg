  <rect width="1200" height="630" rx="54" fill="url(#bg)"/>
  <circle cx="1060" cy="106" r="126" fill="#6E7CFF" fill-opacity="0.18"/>
  <circle cx="116" cy="520" r="158" fill="#7BF0C7" fill-opacity="0.10"/>
  <text x="84" y="138" fill="#7BF0C7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800" letter-spacing="4">SLOWDEVLABS · SWIPE: FLAGS</text>
  <text x="84" y="244" fill="#F7F8FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Swipe. Choose. Remember.</text>
  <text x="84" y="296" fill="#C7D0F7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="500">A fast flag quiz game built for short sessions and quick replay.</text>
  <rect x="84" y="372" width="214" height="56" rx="28" fill="#F7F8FF" fill-opacity="0.10"/>

  <text x="946" y="493" fill="#EAF0FF" fill-opacity="0.80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3">SWIPE UP / SWIPE DOWN</text>

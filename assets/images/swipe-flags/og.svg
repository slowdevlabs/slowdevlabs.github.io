<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Swipe: Flags preview image</title>
  <desc id="desc">A wide preview image for the Swipe: Flags landing page.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="70" x2="1024" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1022"/>
      <stop offset="1" stop-color="#152448"/>
    </linearGradient>
    <linearGradient id="card" x1="650" y1="140" x2="1020" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2147"/>
      <stop offset="1" stop-color="#0D1230"/>
    </linearGradient>
    <linearGradient id="stripe1" x1="696" y1="210" x2="930" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6D365"/>

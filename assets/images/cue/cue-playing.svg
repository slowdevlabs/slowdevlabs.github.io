  <text x="132" y="1244" fill="#f7f8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="62" font-weight="800">00:14</text>
  <text x="548" y="1194" fill="#7ff3ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800">Answer lock</text>
  <rect x="548" y="1226" width="334" height="74" rx="24" fill="#7ff3ff" fill-opacity=".16"/>
  <text x="596" y="1274" fill="#f7f8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700">Tap once to confirm</text>
  <text x="92" y="1760" fill="#f7f8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700" letter-spacing="4">NEON RETRO GAMEPLAY</text>

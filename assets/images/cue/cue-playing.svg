  <path d="M148 714h42l24-118 32 180 28-88 26 114 30-160 24 72 22-48h42" fill="none" stroke="#7ff3ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 794h42l24-118 32 180 28-88 26 114 30-160 24 72 22-48h42" fill="none" stroke="#ff6bd6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
  <rect x="152" y="904" width="776" height="18" rx="9" fill="#f7f8ff" fill-opacity=".12"/>
  <rect x="152" y="904" width="388" height="18" rx="9" fill="#7ff3ff" fill-opacity=".88"/>
  <circle cx="168" cy="982" r="30" fill="#7ff3ff"/>
  <rect x="222" y="960" width="368" height="18" rx="9" fill="#f7f8ff" fill-opacity=".9"/>
  <rect x="222" y="992" width="206" height="12" rx="6" fill="#a3abdc"/>
  <circle cx="168" cy="1052" r="30" fill="#ff6bd6"/>
  <rect x="222" y="1030" width="280" height="18" rx="9" fill="#f7f8ff" fill-opacity=".9"/>
  <rect x="222" y="1062" width="224" height="12" rx="6" fill="#a3abdc"/>
  <rect x="92" y="1126" width="896" height="218" rx="42" fill="#0b1020" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".06"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CUE Playing screenshot</title>
  <desc id="desc">Playing screen mockup with neon waveform and playback cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08101f"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" rx="78" fill="url(#bg)"/>
  <circle cx="864" cy="268" r="204" fill="#7ff3ff" fill-opacity=".1"/>
  <circle cx="232" cy="1560" r="184" fill="#ff6bd6" fill-opacity=".08"/>

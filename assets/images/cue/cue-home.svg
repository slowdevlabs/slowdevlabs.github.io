<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CUE Home screenshot</title>
  <desc id="desc">Home screen mockup for CUE showing game entry and preview cue controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1122"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="12%" r="60%">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity=".22"/>
      <stop offset="0.5" stop-color="#ff6bd6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff6bd6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" rx="78" fill="url(#bg)"/>
  <rect width="1080" height="1920" rx="78" fill="url(#glow)"/>
  <circle cx="814" cy="278" r="168" fill="#7ff3ff" fill-opacity=".08"/>
  <circle cx="266" cy="1550" r="208" fill="#ff6bd6" fill-opacity=".08"/>
  <rect x="92" y="98" width="896" height="184" rx="42" fill="#0e1630" fill-opacity=".88" stroke="#7ff3ff" stroke-opacity=".18"/>
